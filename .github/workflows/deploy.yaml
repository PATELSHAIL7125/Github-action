name : Deploy node app to Aws EC2 Server

on:
  push:
     branches:
       - main

jobs:
  deploy:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Depoloy via SSH
          uses: appleboy/ssh-action@master
          with:
            host: ${{secrets.SSH_HOST}}
            username: root
            key: ${{secrets.SSH_KEY}}
            script: |
              cd /home/ubuntu/Github-action
              git pull 
              docker-compose up -d --build
